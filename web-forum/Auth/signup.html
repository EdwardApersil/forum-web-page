<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Auth | Signup</title>
</head>
<body>
    <div class="container">
        <h3>
            Create an account
        </h3>
        <form action="">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="name form-control" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="email form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="password form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
            <p>Already have an account? <a href="/Auth/login.html">login here</a></p>
        </form>
    </div>
    <script src="/main.js"></script>
    <script src="/Auth/auth.js"></script>
</body>
</html>
